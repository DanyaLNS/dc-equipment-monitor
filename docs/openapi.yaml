openapi: 3.0.3
info:
  title: DC Equipment Monitor API
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /health/live:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /health/ready:
    get:
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }
  /auth/login:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string, minLength: 1, maxLength: 100 }
                password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id: { type: string }
                          login: { type: string }
                          role: { type: string, enum: [ADMIN, OBSERVER] }
                      csrf_token: { type: string }
                      session_expires_at: { type: string, format: date-time }
                  meta:
                    type: object
                    properties:
                      server_time: { type: string, format: date-time }
        "401": { description: Invalid credentials }
        "429": { description: Rate limited }
  /auth/me:
    get:
      responses:
        "200": { description: Current user }
        "401": { description: Unauthenticated }
  /auth/logout:
    post:
      responses:
        "204": { description: No content }
  /racks:
    get:
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: List }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                location: { type: string, maxLength: 200, nullable: true }
                description: { type: string, maxLength: 2000, nullable: true }
      responses:
        "201": { description: Created }
        "409": { description: Duplicate name }
  /racks/{id}:
    get:
      responses:
        "200": { description: Rack }
    patch:
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                location: { type: string, nullable: true }
                description: { type: string, nullable: true }
      responses:
        "200": { description: Updated }
        "412": { description: Version conflict }
        "428": { description: Precondition required }
    delete:
      responses:
        "204": { description: No content }
        "409": { description: Rack not empty }
  /equipment:
    get:
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: rack_id, in: query, schema: { type: integer } }
        - { name: type, in: query, schema: { type: string, enum: [SERVER, NETWORK, STORAGE, OTHER] } }
        - { name: monitoring_enabled, in: query, schema: { type: boolean } }
        - { name: target_state, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200": { description: List }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rack_id, name, inventory_number, type, address]
              properties:
                rack_id: { type: integer }
                name: { type: string, minLength: 1, maxLength: 200 }
                inventory_number: { type: string, minLength: 1, maxLength: 100 }
                type: { type: string, enum: [SERVER, NETWORK, STORAGE, OTHER] }
                address: { type: string, maxLength: 253 }
                monitoring_enabled: { type: boolean, default: true }
      responses:
        "201": { description: Created }
        "409": { description: Duplicate inventory number }
  /equipment/{id}:
    get:
      responses:
        "200": { description: Equipment }
    patch:
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated }
    delete:
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      responses:
        "204": { description: No content }
  /equipment/{id}/view:
    get:
      responses:
        "200": { description: Composite view }
  /equipment/{id}/targets:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tcp_port]
              properties:
                tcp_port: { type: integer, minimum: 1, maximum: 65535 }
                label: { type: string, maxLength: 100, nullable: true }
                monitoring_enabled: { type: boolean, default: true }
      responses:
        "201": { description: Created }
        "409": { description: Duplicate tcp port }
  /targets/{id}:
    get:
      responses:
        "200": { description: Target }
    patch:
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated }
    delete:
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      responses:
        "204": { description: No content }
  /targets/{id}/history:
    get:
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: status, in: query, schema: { type: string, enum: [AVAILABLE, UNAVAILABLE] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200": { description: History }
  /summary:
    get:
      responses:
        "200": { description: Summary }
  /settings:
    get:
      responses:
        "200": { description: Settings }
    patch:
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                interval_seconds: { type: integer, minimum: 10, maximum: 3600 }
                timeout_ms: { type: integer, minimum: 100, maximum: 10000 }
                concurrency: { type: integer, minimum: 1, maximum: 200 }
                stale_after_seconds: { type: integer, minimum: 1, maximum: 86400 }
                retention_days: { type: integer, minimum: 1, maximum: 30 }
      responses:
        "200": { description: Updated }
        "422": { description: Validation error }
  /client-events:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    properties:
                      code: { type: string, enum: [API_UNAVAILABLE, UI_ERROR] }
                      route_template: { type: string }
                      occurred_at: { type: string, format: date-time }
                      request_id: { type: string, nullable: true }
      responses:
        "204": { description: No content }
        "429": { description: Rate limited }
  /metrics:
    get:
      responses:
        "200": { description: Metrics }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
security:
  - cookieAuth: []
